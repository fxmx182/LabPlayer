name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "Android/**"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e empacotar o APK
    # Ubuntu, não macOS: o runner Linux não conta 10× contra a cota e já vem
    # com JDK e SDK do Android. O irmão de iOS não tem essa escolha; este tem,
    # e é por isso que aqui um build custa minutos em vez de espera.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # para publicar o release "android-latest"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Android/gradle/libs.versions.toml', 'Android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Compilar
        working-directory: Android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PviperCommit=${GITHUB_SHA:0:7} 2>&1 | tee build.log

      # O log completo do job só é baixável por quem tem admin no repositório,
      # mas as *anotações* de um repo público são lidas por qualquer um. Mesmo
      # truque do workflow de iOS: republicar os erros como anotação deixa a
      # falha diagnosticável de fora, sem token de acesso.
      - name: Republicar erros do compilador como anotação
        if: failure()
        working-directory: Android
        run: |
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path("build.log")
          if not log.exists():
              print("::error title=Sem log::build.log não foi gerado")
              raise SystemExit(0)

          text = log.read_text(errors="replace")
          seen, errors = set(), []
          for line in text.splitlines():
              if re.match(r"^e: |error:|^FAILURE|Caused by:", line.strip()):
                  line = line.strip()
                  if line not in seen:
                      seen.add(line)
                      errors.append(line)

          if not errors:
              errors = ["Nenhuma linha de erro encontrada. Fim do log:",
                        "\n".join(text.splitlines()[-40:])]

          body = "\n".join(errors)[:6000]
          enc = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Erros de compilação ({len(errors)})::{enc}")
          PY

      # Nada a renomear aqui: a tarefa `publicarApks` do Gradle já deixou os
      # arquivos em Android/dist/ com nome de aparelho em vez de nome de
      # arquitetura. Duplicar essa regra no workflow faria as duas versões
      # divergirem no dia em que uma mudasse.
      - name: Conferir os APKs
        working-directory: Android
        run: ls -lh dist/

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ViperPlayer-apk
          path: Android/dist/*.apk
          retention-days: 30
          if-no-files-found: error

      # Artefato só baixa autenticado; asset de release baixa com um curl seco
      # — dá para puxar o APK direto do celular, sem navegador nem login.
      - name: Publicar release "android-latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest Android/dist/*.apk \
            --title "Viper Player (Android) — build mais recente" \
            --notes "Compilado de ${GITHUB_SHA:0:7}.

          | Arquivo | Para |
          |---|---|
          | \`ViperPlayer-TV.apk\` | **televisão** — Google TV, Fire TV, Shield |
          | \`ViperPlayer-Celular.apk\` | celular deste lado de 2015 |
          | \`ViperPlayer-Celular-Antigo.apk\` | celular anterior a isso |
          | \`ViperPlayer-PC-x86_64.apk\` | PC e Chromebook — emulador, Waydroid, BlueStacks |

          São variantes **exclusivas**: o de TV exige o recurso \`leanback\` e não
          instala em celular; o de celular não aparece na tela inicial da TV.

          O da TV é maior porque traz as **duas** arquiteturas ARM: muita caixinha de
          Google TV e quase todo Fire Stick rodam Android de 32 bits sobre processador
          de 64, e um APK só de arm64 é recusado por elas.

          A variante de celular fala com o **Android Auto** — só áudio, que é tudo o
          que a plataforma permite a app de terceiro — e toca em segundo plano com a
          tela apagada.

          **Não instale pela Play Store** — o app não está lá, e a loja da TV dirá que
          ele é incompatível só por não o conhecer. Use o app **Downloader** com o
          endereço abaixo, ou \`adb\`:

          \`\`\`
          curl -L -O https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/ViperPlayer-TV.apk
          adb install -r ViperPlayer-TV.apk
          \`\`\`

          Assinado com a chave do repositório (\`Android/keystore/viper.jks\`), sempre a mesma — atualizar por cima funciona." \
            --prerelease
