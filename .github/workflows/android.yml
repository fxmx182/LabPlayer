name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "Android/**"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e empacotar o APK
    # Ubuntu, não macOS: o runner Linux não conta 10× contra a cota e já vem
    # com JDK e SDK do Android. O irmão de iOS não tem essa escolha; este tem,
    # e é por isso que aqui um build custa minutos em vez de espera.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # para publicar o release "android-latest"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Android/gradle/libs.versions.toml', 'Android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Compilar
        working-directory: Android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PviperCommit=${GITHUB_SHA:0:7} 2>&1 | tee build.log

      # O log completo do job só é baixável por quem tem admin no repositório,
      # mas as *anotações* de um repo público são lidas por qualquer um. Mesmo
      # truque do workflow de iOS: republicar os erros como anotação deixa a
      # falha diagnosticável de fora, sem token de acesso.
      - name: Republicar erros do compilador como anotação
        if: failure()
        working-directory: Android
        run: |
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path("build.log")
          if not log.exists():
              print("::error title=Sem log::build.log não foi gerado")
              raise SystemExit(0)

          text = log.read_text(errors="replace")
          seen, errors = set(), []
          for line in text.splitlines():
              if re.match(r"^e: |error:|^FAILURE|Caused by:", line.strip()):
                  line = line.strip()
                  if line not in seen:
                      seen.add(line)
                      errors.append(line)

          if not errors:
              errors = ["Nenhuma linha de erro encontrada. Fim do log:",
                        "\n".join(text.splitlines()[-40:])]

          body = "\n".join(errors)[:6000]
          enc = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Erros de compilação ({len(errors)})::{enc}")
          PY

      # Nada a renomear aqui: a tarefa `publicarApks` do Gradle já deixou os
      # arquivos em Android/dist/ com nome de aparelho em vez de nome de
      # arquitetura. Duplicar essa regra no workflow faria as duas versões
      # divergirem no dia em que uma mudasse.
      - name: Conferir os APKs
        working-directory: Android
        run: ls -lh dist/

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ViperPlayer-apk
          path: Android/dist/*.apk
          retention-days: 30
          if-no-files-found: error

      # Um release NOVO a cada build, e não a mesma tag reescrita.
      #
      # Reescrever apagava o histórico: não dava para voltar à versão de ontem
      # nem comparar o que mudou. Agora cada build vira um release próprio,
      # etiquetado com a data e o commit, e o mais recente é marcado como
      # "latest" — o que dá, de graça, uma URL fixa que sempre aponta para ele:
      #
      #   /releases/latest/download/ViperPlayer-TV.apk
      #
      # Assim o histórico existe e o link de instalar continua o mesmo.
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSAO=$(grep -oP 'versionName = "\K[^"]+' Android/app/build.gradle.kts)
          DATA=$(date -u +%Y.%m.%d)
          TAG="android-v${VERSAO}-${DATA}-${GITHUB_SHA:0:7}"
          ASSUNTO=$(git log -1 --pretty=%s)

          # A tag antiga de "sempre a mesma" sai de cena na primeira vez.
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true

          {
            echo "$ASSUNTO"
            echo
            echo "| Arquivo | Para |"
            echo "|---|---|"
            echo "| \`ViperPlayer-TV.apk\` | **televisão** — Google TV, Fire TV, Shield |"
            echo "| \`ViperPlayer-Celular.apk\` | **celular** deste lado de 2015 |"
            echo "| \`ViperPlayer-Celular-Antigo.apk\` | celular anterior a isso |"
            echo "| \`ViperPlayer-PC-x86_64.apk\` | PC e Chromebook — emulador, Waydroid, BlueStacks |"
            echo
            echo "São variantes **exclusivas**: a de TV exige \`leanback\` e não instala em celular;"
            echo "a de celular não aparece na tela inicial da TV. A de celular fala com o Android Auto."
            echo
            echo "**Na TV, não use a Play Store** — o app não está publicado lá, e a loja dirá que é"
            echo "incompatível só por não o conhecer. Use o app Downloader com o endereço abaixo, ou \`adb\`."
            echo
            echo '```'
            echo "curl -L -O https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/ViperPlayer-TV.apk"
            echo "adb install -r ViperPlayer-TV.apk"
            echo '```'
            echo
            echo "Este link não muda: ele sempre entrega o build mais recente."
            echo
            echo "---"
            echo
            echo "Commit \`${GITHUB_SHA:0:7}\` · build ${GITHUB_RUN_NUMBER}"
            echo
            git log -1 --pretty=%b
          } > notas.md

          gh release create "$TAG" Android/dist/*.apk \
            --title "Viper Player Android — ${DATA} (${GITHUB_SHA:0:7})" \
            --notes-file notas.md \
            --latest

      # O histórico é útil; guardá-lo inteiro não é. Cada build são 300 MB, e
      # ninguém volta trinta versões — dez cobre "a de ontem quebrou, me devolve
      # a de anteontem", que é para o que serve.
      - name: Podar releases antigos
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName \
            --jq '.[] | select(.tagName | startswith("android-v")) | .tagName' \
            | tail -n +11 \
            | while read -r tag; do
                echo "removendo $tag"
                gh release delete "$tag" --yes --cleanup-tag || true
              done
