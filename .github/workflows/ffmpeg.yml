name: FFmpeg xcframework

# Deliberadamente separado do build do app: compilar o FFmpeg é demorado e
# frágil, e uma falha aqui não pode derrubar o pipeline que gera o .ipa.
on:
  push:
    branches: [main]
    paths:
      - 'Scripts/build-ffmpeg.sh'
      - '.github/workflows/ffmpeg.yml'
  workflow_dispatch:

jobs:
  ffmpeg:
    name: Compilar FFmpeg para iOS
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # A chave é o hash do script: mexeu na configuração, recompila; não
      # mexeu, restaura em segundos.
      - name: Restaurar cache
        id: cache
        uses: actions/cache@v4
        with:
          path: Vendor/FFmpeg.xcframework
          key: ffmpeg-ios-${{ hashFiles('Scripts/build-ffmpeg.sh') }}

      - name: Compilar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          chmod +x Scripts/build-ffmpeg.sh
          ./Scripts/build-ffmpeg.sh 2>&1 | tee ffmpeg-build.log

      # Mesmo truque do build do app: o log do job exige admin, anotações não.
      - name: Republicar erros como anotação
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path("ffmpeg-build.log")
          if not log.exists():
              print("::error title=Sem log::ffmpeg-build.log não foi gerado")
              raise SystemExit(0)

          text = log.read_text(errors="replace")
          linhas = text.splitlines()

          # O ./configure do FFmpeg não escreve o motivo no stdout — ele manda
          # para ffbuild/config.log. Sem isso a anotação viria vazia.
          conf = pathlib.Path(".ffmpeg-build")
          cfg_logs = list(conf.glob("*/ffbuild/config.log")) if conf.exists() else []
          extra = []
          for c in cfg_logs:
              extra = ["", f"--- fim de {c} ---"]
              extra += c.read_text(errors="replace").splitlines()[-50:]

          erros = [l.strip() for l in linhas
                   if re.search(r"(error:|Error \d|ERROR:|not found|No such file)", l)]
          # dict.fromkeys tira duplicata preservando a ordem.
          corpo = "\n".join(list(dict.fromkeys(erros))[-40:])
          if not corpo:
              corpo = "\n".join(linhas[-40:])
          corpo = "\n".join([corpo] + extra)[:6000]

          enc = corpo.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Falha ao compilar FFmpeg::{enc}")
          PY

      # "Compilou" não é "compilou com o que precisamos": um --disable-everything
      # com um nome de componente errado passa silenciosamente e só quebraria
      # muito depois, ao tentar abrir um MKV. Aqui a ausência falha o build.
      - name: Conferir conteúdo da biblioteca
        run: |
          set -euo pipefail
          LIB=$(find Vendor/FFmpeg.xcframework -name 'libffmpeg.a' | head -1)
          [ -n "$LIB" ] || { echo "::error::libffmpeg.a não existe no xcframework"; exit 1; }

          echo "arquitetura: $(lipo -info "$LIB")"

          # Um arquivo, não uma variável de shell: com dezenas de milhares de
          # símbolos, `echo "$VAR" | grep` é frágil. E fixamos a arquitetura —
          # sem -arch, o nm do runner tenta ler com a arquitetura do host e
          # devolve resultado parcial numa lib só de arm64/iOS.
          nm -arch arm64 --defined-only -g -j "$LIB" 2>/dev/null \
            | sed 's/^_//' | sort -u > /tmp/simbolos.txt
          TOTAL=$(wc -l < /tmp/simbolos.txt | tr -d ' ')
          echo "símbolos definidos: $TOTAL"
          [ "$TOTAL" -gt 100 ] || {
            echo "::error title=nm não leu a biblioteca::só $TOTAL símbolos — a verificação, não a build, está quebrada"
            exit 1
          }

          FALTANTES=""
          checar() {
            if grep -qx "$1" /tmp/simbolos.txt; then
              printf '  ok      %s  (%s)\n' "$1" "$2"
            else
              printf '  FALTOU  %s  (%s)\n' "$1" "$2"
              FALTANTES="${FALTANTES}${1} — ${2}"$'\n'
            fi
          }

          echo "— API que o motor vai usar —"
          checar avformat_open_input  "abrir contêiner"
          checar av_read_frame        "ler pacotes"
          checar av_seek_frame        "seek para keyframe"
          checar avcodec_send_packet  "decodificar"
          checar avcodec_receive_frame "receber frame"
          checar avio_alloc_context   "I/O próprio — é por aqui que o SMB entra"
          checar swr_convert          "reamostrar áudio"
          checar sws_scale            "converter pixel format"

          echo "— contêineres que o AVFoundation recusa —"
          checar ff_matroska_demuxer  "mkv"
          checar ff_avi_demuxer       "avi"
          checar ff_mpegts_demuxer    "ts"
          checar ff_flv_demuxer       "flv"
          checar ff_asf_demuxer       "wmv"

          echo "— áudio que costuma abrir mudo no iOS —"
          checar ff_dca_decoder       "DTS"
          checar ff_truehd_decoder    "TrueHD"
          checar ff_eac3_decoder      "E-AC3"
          checar ff_ac3_decoder       "AC3"

          echo "— vídeo e aceleração por hardware —"
          checar ff_h264_decoder      "H.264 software"
          checar ff_hevc_decoder      "HEVC software"
          checar ff_h264_videotoolbox_hwaccel "H.264 por hardware"
          checar ff_hevc_videotoolbox_hwaccel "HEVC por hardware"

          echo "— legendas —"
          checar ff_subrip_decoder    "SRT"
          checar ff_ass_decoder       "ASS/SSA"
          checar ff_pgssub_decoder    "PGS (Blu-ray)"

          echo
          echo "cabeçalhos: $(find Vendor/FFmpeg.xcframework -name '*.h' | wc -l | tr -d ' ')"
          du -sh Vendor/FFmpeg.xcframework

          if [ -n "$FALTANTES" ]; then
            # Junto vai o contexto para distinguir "a build está errada" de "a
            # verificação está errada" sem gastar outro ciclo de CI: total de
            # símbolos e uma amostra do que existe com nome parecido.
            DIAG="símbolos definidos: $TOTAL"$'\n'"amostra com 'avformat_': $(grep -c '^avformat_' /tmp/simbolos.txt || true)"$'\n'
            DIAG="${DIAG}amostra com 'ff_.*_demuxer': $(grep -c '_demuxer$' /tmp/simbolos.txt || true)"$'\n'
            DIAG="${DIAG}primeiros demuxers: $(grep '_demuxer$' /tmp/simbolos.txt | head -8 | tr '\n' ' ')"$'\n\n'
            ENC=$(printf '%s' "${DIAG}FALTOU:"$'\n'"$FALTANTES" | python3 -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\n','%0A'))")
            echo "::error title=Componentes ausentes no FFmpeg::$ENC"
            exit 1
          fi
          DEMUX=$(grep -c '_demuxer$' /tmp/simbolos.txt || true)
          DECOD=$(grep -c '_decoder$' /tmp/simbolos.txt || true)
          PARS=$(grep -c '_parser$' /tmp/simbolos.txt || true)
          TAM=$(du -sh Vendor/FFmpeg.xcframework | cut -f1)
          echo "::notice title=FFmpeg conferido::demuxers: $DEMUX · decodificadores: $DECOD · parsers: $PARS · tamanho: $TAM"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: FFmpeg-xcframework
          path: Vendor/FFmpeg.xcframework
          retention-days: 30
          if-no-files-found: error
