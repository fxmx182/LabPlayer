name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e empacotar
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Mostrar Xcode em uso
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      # O xcframework não é versionado (são megabytes de binário). Vem do
      # cache que o workflow ffmpeg.yml preencheu; a chave é a mesma nos dois.
      - name: Restaurar FFmpeg do cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: Vendor/FFmpeg.xcframework
          key: ffmpeg-ios-${{ hashFiles('Scripts/build-ffmpeg.sh') }}

      - name: Compilar FFmpeg (só se o cache falhar)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x Scripts/build-ffmpeg.sh
          ./Scripts/build-ffmpeg.sh

      - name: Gerar projeto
        run: xcodegen generate

      # Assinatura ad-hoc ("-"), NÃO ausência de assinatura.
      #
      # Com CODE_SIGNING_ALLOWED=NO o binário sai sem sequer o comando
      # LC_CODE_SIGNATURE no cabeçalho Mach-O. O AltServer então tem que criar
      # essa estrutura do zero ao reassinar, e é aí que ele erra: o iOS recusa
      # o resultado com "spawn failed, error=85: Bad executable" — sem crash
      # report, porque o processo nunca chega a existir.
      #
      # Ad-hoc resolve: o binário já sai com a estrutura de assinatura montada
      # e o AltServer só substitui o conteúdo pelo certificado do Apple ID.
      # Continua sem exigir certificado no CI.
      - name: Compilar (assinatura ad-hoc)
        run: |
          set -o pipefail
          xcodebuild \
            -project LabPlayer.xcodeproj \
            -scheme LabPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log

      # Conferir aqui em vez de descobrir no aparelho: um app sem assinatura
      # só dá sinal de vida como um ícone que pisca e fecha.
      - name: Conferir que o binário está assinado
        run: |
          APP="build/Build/Products/Release-iphoneos/LabPlayer.app"
          codesign -dvvv "$APP" 2>&1 | sed 's/^/  /'
          if ! codesign -dv "$APP" 2>&1 | grep -q 'Signature'; then
            echo "::error title=Binário sem assinatura::o .ipa não vai abrir no aparelho"
            exit 1
          fi
          otool -l "$APP/LabPlayer" | grep -q LC_CODE_SIGNATURE \
            || { echo "::error title=Sem LC_CODE_SIGNATURE::cabeçalho Mach-O sem espaço para assinatura"; exit 1; }
          echo "assinatura presente"

      # O log completo do job só é baixável por quem tem admin no repositório,
      # mas as *anotações* de um repo público são lidas por qualquer um. Então
      # republicamos os erros do compilador como anotação: assim dá para
      # diagnosticar a falha de fora, sem token de acesso.
      - name: Republicar erros do compilador como anotação
        if: failure()
        run: |
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path("build.log")
          if not log.exists():
              print("::error title=Sem log::build.log não foi gerado")
              raise SystemExit(0)

          text = log.read_text(errors="replace")
          seen, errors = set(), []
          for line in text.splitlines():
              if re.search(r"(error:|fatal error:|\*\* BUILD FAILED)", line):
                  line = line.strip()
                  if line not in seen:
                      seen.add(line)
                      errors.append(line)

          if not errors:
              tail = "\n".join(text.splitlines()[-40:])
              errors = ["Nenhuma linha 'error:' encontrada. Fim do log:", tail]

          body = "\n".join(errors)[:6000]
          enc = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Erros de compilação ({len(errors)})::{enc}")
          PY

      - name: Empacotar .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/LabPlayer.app"
          test -d "$APP" || { echo "::error::App não encontrado em $APP"; exit 1; }
          mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          (cd payload && zip -qry ../LabPlayer.ipa Payload)
          ls -lh LabPlayer.ipa

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: LabPlayer-ipa
          path: LabPlayer.ipa
          retention-days: 30
          if-no-files-found: error
