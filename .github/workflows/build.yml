name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e empacotar
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Mostrar Xcode em uso
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        run: xcodegen generate

      # Sem assinatura de propósito. O .ipa sai "cru" e quem assina é o
      # SideStore/AltStore no aparelho, com o Apple ID do usuário. Assim o CI
      # não precisa de certificado nem de conta paga.
      - name: Compilar (sem assinar)
        run: |
          set -o pipefail
          xcodebuild \
            -project LabPlayer.xcodeproj \
            -scheme LabPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empacotar .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/LabPlayer.app"
          test -d "$APP" || { echo "::error::App não encontrado em $APP"; exit 1; }
          mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          (cd payload && zip -qry ../LabPlayer.ipa Payload)
          ls -lh LabPlayer.ipa

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: LabPlayer-ipa
          path: LabPlayer.ipa
          retention-days: 30
          if-no-files-found: error
