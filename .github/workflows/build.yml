name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e empacotar
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write   # para publicar o release "latest"

    steps:
      - uses: actions/checkout@v4

      - name: Mostrar Xcode em uso
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      # O xcframework não é versionado (são megabytes de binário). Vem do
      # cache que o workflow ffmpeg.yml preencheu; a chave é a mesma nos dois.
      - name: Restaurar FFmpeg do cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: Vendor/FFmpeg.xcframework
          key: ffmpeg-ios-${{ hashFiles('Scripts/build-ffmpeg.sh') }}

      - name: Compilar FFmpeg (só se o cache falhar)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x Scripts/build-ffmpeg.sh
          ./Scripts/build-ffmpeg.sh

      - name: Carimbar o build com o commit
        run: |
          /usr/libexec/PlistBuddy -c "Set :LabPlayerBuild ${GITHUB_SHA:0:7}" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :LabPlayerBuild" App/Info.plist

      - name: Gerar projeto
        run: xcodegen generate

      - name: Compilar (sem assinar)
        run: |
          set -o pipefail
          xcodebuild \
            -project LabPlayer.xcodeproj \
            -scheme LabPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      # Assinar ad-hoc DEPOIS do xcodebuild, não durante.
      #
      # CODE_SIGNING_ALLOWED=NO deixa o binário sem o comando LC_CODE_SIGNATURE
      # no cabeçalho Mach-O (verificado: ele realmente sai ausente). O AltServer
      # teria que inserir essa estrutura ao reassinar e não consegue — o iOS
      # recusa com "spawn failed, error=85: Bad executable", sem crash report,
      # porque o processo nunca chega a nascer.
      #
      # `xcodebuild` proíbe ad-hoc no SDK de iOS ("Ad Hoc code signing is not
      # allowed with SDK 'iOS 18.5'"), mas a proibição é dele, não do codesign.
      # Assinando aqui, o binário ganha a estrutura e o AltServer só troca o
      # conteúdo pelo certificado do Apple ID. O CI segue sem certificado.
      - name: Assinar ad-hoc
        run: |
          APP="build/Build/Products/Release-iphoneos/LabPlayer.app"
          codesign --force --sign - --timestamp=none "$APP"

      - name: Conferir a assinatura
        run: |
          APP="build/Build/Products/Release-iphoneos/LabPlayer.app"
          codesign -dvvv "$APP" 2>&1 | sed 's/^/  /'
          otool -l "$APP/LabPlayer" | grep -q LC_CODE_SIGNATURE || {
            echo "::error title=Sem LC_CODE_SIGNATURE::o app não vai abrir no aparelho — pisca e fecha"
            exit 1
          }
          echo "LC_CODE_SIGNATURE presente"

      # O log completo do job só é baixável por quem tem admin no repositório,
      # mas as *anotações* de um repo público são lidas por qualquer um. Então
      # republicamos os erros do compilador como anotação: assim dá para
      # diagnosticar a falha de fora, sem token de acesso.
      - name: Republicar erros do compilador como anotação
        if: failure()
        run: |
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path("build.log")
          if not log.exists():
              print("::error title=Sem log::build.log não foi gerado")
              raise SystemExit(0)

          text = log.read_text(errors="replace")
          seen, errors = set(), []
          for line in text.splitlines():
              if re.search(r"(error:|fatal error:|\*\* BUILD FAILED)", line):
                  line = line.strip()
                  if line not in seen:
                      seen.add(line)
                      errors.append(line)

          if not errors:
              tail = "\n".join(text.splitlines()[-40:])
              errors = ["Nenhuma linha 'error:' encontrada. Fim do log:", tail]

          body = "\n".join(errors)[:6000]
          enc = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Erros de compilação ({len(errors)})::{enc}")
          PY

      - name: Empacotar .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/LabPlayer.app"
          test -d "$APP" || { echo "::error::App não encontrado em $APP"; exit 1; }
          mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          (cd payload && zip -qry ../LabPlayer.ipa Payload)
          ls -lh LabPlayer.ipa

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: LabPlayer-ipa
          path: LabPlayer.ipa
          retention-days: 30
          if-no-files-found: error

      # Artefato só baixa autenticado; asset de release baixa com um curl seco.
      # Isso deixa o .ipa acessível direto do servidor de casa — nada de abrir
      # o navegador e descompactar zip a cada iteração.
      - name: Publicar release "latest"
        id: release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest LabPlayer.ipa \
            --title "LabPlayer — build mais recente" \
            --notes "Compilado de ${GITHUB_SHA:0:7}. Assinado ad-hoc; o AltServer/SideStore reassina no aparelho.

          Instalar:
          \`\`\`
          curl -L -o LabPlayer.ipa https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/LabPlayer.ipa
          Scripts/instalar-no-iphone.sh LabPlayer.ipa
          \`\`\`" \
            --prerelease

  simulador:
    name: Rodar no simulador
    runs-on: macos-15
    needs: build
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Restaurar FFmpeg do cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: Vendor/FFmpeg.xcframework
          key: ffmpeg-ios-${{ hashFiles('Scripts/build-ffmpeg.sh') }}

      - name: Compilar FFmpeg (só se o cache falhar)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x Scripts/build-ffmpeg.sh
          ./Scripts/build-ffmpeg.sh

      - name: Gerar projeto
        run: xcodegen generate

      - name: Compilar para simulador
        run: |
          set -o pipefail
          xcodebuild \
            -project LabPlayer.xcodeproj \
            -scheme LabPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee sim-build.log

      - name: Republicar erros do simulador como anotação
        if: failure()
        run: |
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path("sim-build.log")
          texto = log.read_text(errors="replace") if log.exists() else ""

          # "error:" sozinho não basta: o que interessa num erro de link são as
          # linhas de símbolo indefinido e as do ld, que não trazem essa marca.
          # Filtrar só por "error:" devolvia "linker command failed" e nada mais.
          padrao = re.compile(
              r"(error:|\*\* BUILD FAILED|Undefined symbol|undefined symbol"
              r"|symbol not found|^ld: |building for .* but linking"
              r"|was built for newer|Could not find module)")
          erros = [l.strip() for l in texto.splitlines() if padrao.search(l)]
          corpo = "\n".join(list(dict.fromkeys(erros))[:60]) or "\n".join(texto.splitlines()[-60:])
          enc = corpo[:6000].replace("%", "%25").replace("\n", "%0A")
          print(f"::error title=Falha ao compilar para simulador::{enc}")
          PY

      - name: Abrir o app no simulador
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[5-9]' | grep -oE '[0-9A-F-]{36}')
          [ -n "$UDID" ] || { echo "::error::nenhum simulador de iPhone disponível"; exit 1; }
          echo "simulador: $UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP="build-sim/Build/Products/Debug-iphonesimulator/LabPlayer.app"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.mauricio.labplayer

          # Tempo para a interface assentar antes da captura.
          sleep 12
          xcrun simctl io "$UDID" screenshot simulador.png
          ls -lh simulador.png

          # Um app que morreu no arranque deixa relatório aqui. É esta
          # verificação que transforma "abriu" em teste de verdade.
          CRASHES=$(ls ~/Library/Logs/DiagnosticReports/LabPlayer* 2>/dev/null || true)
          if [ -n "$CRASHES" ]; then
            echo "::error title=App quebrou no simulador::$(head -c 2000 $CRASHES | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice title=Simulador::app abriu e seguiu vivo por 12 s"

      # Asset de release é público: dá para baixar a captura com um curl seco,
      # sem token, e enxergar a tela do app sem instalar em aparelho nenhum.
      - name: Publicar a captura no release
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f simulador.png ] && gh release upload latest simulador.png --clobber || true
