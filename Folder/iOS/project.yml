name: LibertyXFolder

# O LibertyX Folder do iPhone: o mesmo gerenciador de arquivos do Android
# (/DATA/Claudinho/Arquivos), refeito em SwiftUI. Mora neste repositório, e não
# num próprio, pelo mesmo motivo do Player: sem macOS em casa, o compilador é o
# runner de macOS do GitHub Actions, e em repositório público ele é ilimitado.
# O build é .github/workflows/folder-ios.yml.

options:
  bundleIdPrefix: com.mauricio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

packages:
  # O mesmo cliente SMB do Player: Swift puro, MIT, sem nada nativo. Ler e
  # gravar por posição (`FileReader.read(offset:length:)` e `Session.write`)
  # é o que deixa copiar com progresso e cancelar no meio.
  SMBClient:
    url: https://github.com/kishikawakatsumi/SMBClient
    from: "0.3.1"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  LibertyXFolder:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        # O mesmo nome do pacote Android (com.mauricio.libertyx.files): a
        # família toda se reconhece pelo prefixo.
        PRODUCT_BUNDLE_IDENTIFIER: com.mauricio.libertyx.files
        PRODUCT_NAME: LibertyXFolder
        INFOPLIST_FILE: App/Info.plist
        # Nenhum CODE_SIGN_ENTITLEMENTS de propósito: sem entitlements o alvo
        # continua assinável por um Apple ID gratuito (Sideloadly/AltStore).
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_BITCODE: NO
    dependencies:
      - package: SMBClient
