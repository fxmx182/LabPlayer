name: LabPlayer

options:
  bundleIdPrefix: com.mauricio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  LabPlayer:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mauricio.labplayer
        PRODUCT_NAME: LabPlayer
        INFOPLIST_FILE: App/Info.plist
        # Nenhum CODE_SIGN_ENTITLEMENTS de propósito: sem entitlements o alvo
        # continua assinável por um Apple ID gratuito.
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_BITCODE: NO
