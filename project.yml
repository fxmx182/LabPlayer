name: LabPlayer

options:
  bundleIdPrefix: com.mauricio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
  groupSortPosition: top

packages:
  # SMB 2/3 em Swift puro, MIT, sem dependências nativas — importa porque
  # qualquer coisa em C aqui teria que entrar no build do xcframework.
  # `FileReader.read(offset:length:)` é o que permite tocar direto do servidor
  # em vez de baixar o arquivo inteiro antes.
  SMBClient:
    url: https://github.com/kishikawakatsumi/SMBClient
    from: "0.3.1"

  # VLCKit empacotado para SPM. Vinte anos de correções em sincronia A/V,
  # buffering de rede e recuperação de erro — exatamente onde o motor próprio
  # estava falhando. Fala SMB nativamente: basta uma URL smb://.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  LabPlayer:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mauricio.labplayer
        PRODUCT_NAME: LabPlayer
        INFOPLIST_FILE: App/Info.plist
        # Nenhum CODE_SIGN_ENTITLEMENTS de propósito: sem entitlements o alvo
        # continua assinável por um Apple ID gratuito.
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Core/FFmpegBridge.h
        # Recursivo de propósito: assim não dependemos do nome da fatia
        # (ios-arm64) que o xcodebuild escolhe ao montar o xcframework.
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/FFmpeg.xcframework/**

    dependencies:
      - package: SMBClient
      - package: VLCKitSPM
      # Estática: nada a embarcar no bundle, só linkar.
      - framework: Vendor/FFmpeg.xcframework
        embed: false
      # Dependências que o FFmpeg exige do sistema. Faltando qualquer uma, a
      # compilação passa e o *link* quebra — por isso ficam explícitas.
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: AudioToolbox.framework
      - sdk: Security.framework
